<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вода</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="nav-btn" aria-label="Назад" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14.8 5.3 8.1 12l6.7 6.7" />
          </svg>
        </button>

        <div class="brand">
          <div class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 2.7c-2.9 3.7-6 6.9-6 10.1A6 6 0 0 0 18 12.8C18 9.6 14.9 6.4 12 2.7Z" />
            </svg>
          </div>
          <h1>Вода</h1>
          <button class="tiny-btn" aria-label="Параметри" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 9.5h14M5 14.5h14M9 5v14M15 5v14" />
            </svg>
          </button>
          <button class="theme-btn" id="themeBtn" type="button" aria-label="Змінити тему">🌙</button>
        </div>
      </header>

      <div class="subtitle">Щоденник води</div>

      <section class="panel summary-panel">
        <div class="panel-header">
          <span>СЬОГОДНІ</span>
          <span>Ціль: 2.0 л</span>
        </div>

        <div class="summary-body">
          <div class="gauge-block">
            <div class="gauge" id="gauge" aria-label="0 відсотків">
              <div class="gauge-inner">
                <span id="percentValue">0%</span>
              </div>
            </div>
          </div>

          <div class="metrics">
            <div class="metric-value" id="totalValue">0 мл</div>
            <div class="metric-target">/ 2.0 л</div>
            <div class="metric-left" id="remainingValue">Залишилось: 2.0 л</div>
          </div>

          <div class="glass-illustration" aria-hidden="true">
            <div class="glass-top"></div>
            <div class="glass-body">
              <div class="water-fill" id="waterFill"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="panel add-panel">
        <div class="panel-header add-header">
          <span>ДОДАТИ</span>
        </div>

        <div class="quick-add">
          <button class="quick-btn" type="button" data-volume="250">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 5h10v2.5l-1.3 13.3A2 2 0 0 1 13.7 22h-3.4a2 2 0 0 1-2-1.9L7 7.5V5Z" />
              <path d="M9 5V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V5" />
            </svg>
            <small>склянка</small>
            <strong>250 мл</strong>
          </button>

          <button class="quick-btn" type="button" data-volume="350">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6.5 8.5h11v10.2A2.3 2.3 0 0 1 15.2 21h-6.4A2.3 2.3 0 0 1 6.5 18.7V8.5Z" />
              <path d="M9 8.5V6.5a3 3 0 0 1 6 0v2" />
              <path d="M12 11v6M9.5 13.5h5" />
            </svg>
            <small>350 ml</small>
            <strong>350 мл</strong>
          </button>

          <button class="quick-btn" type="button" data-volume="500">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 7.5h10v11.2A2.3 2.3 0 0 1 14.7 21h-5.4A2.3 2.3 0 0 1 7 18.7V7.5Z" />
              <path d="M9.5 7.5V6A2.5 2.5 0 0 1 12 3.5 2.5 2.5 0 0 1 14.5 6v1.5" />
              <path d="M12 10.5v6M9.5 13.5h5" />
            </svg>
            <small>500 ml</small>
            <strong>500 мл</strong>
          </button>

          <button class="quick-btn" type="button" data-volume="1000">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14.5 4.8a2.5 2.5 0 0 1 2.5 2.5v1.4h.4A2.3 2.3 0 0 1 20 11v5.1A2.3 2.3 0 0 1 17.7 18H6.3A2.3 2.3 0 0 1 4 15.7V11a2.3 2.3 0 0 1 2.4-2.3H6.8V7.3a2.5 2.5 0 0 1 2.5-2.5h5.2Z" />
              <path d="M10 8.8h4M12 5.7v3.1" />
            </svg>
            <small>1 л</small>
            <strong>1.0 л</strong>
          </button>
        </div>

        <div class="field volume-field">
          <label for="customAmount">Об'єм (мл)</label>
          <div class="volume-controls">
            <input id="customAmount" type="number" min="50" max="5000" step="50" value="250" aria-label="Об'єм у мілілітрах" />
            <div class="button-stack">
              <button type="button" class="control-btn plus-btn" id="addCustomBtn" aria-label="Додати кількість">+</button>
              <button type="button" class="control-btn minus-btn" id="removeCustomBtn" aria-label="Відняти кількість">−</button>
            </div>
          </div>
        </div>
        <p class="amount-message" id="amountMessage" role="status" aria-live="polite"></p>

        <div class="field note-field">
          <label for="noteInput">Примітка (необов'язково)</label>
          <input id="noteInput" type="text" maxlength="50" placeholder="Наприклад: тренування" aria-label="Примітка" />
        </div>

        <div class="history-panel" id="historyPanel" aria-live="polite">
          <div class="history-header">
            <h3>Історія</h3>
            <button type="button" class="clear-history-btn" id="clearHistoryBtn">Очистити</button>
          </div>
          <ul id="historyList"></ul>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
